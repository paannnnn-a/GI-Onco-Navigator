[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gi-onco-navigator"
version = "1.0.0"
description = "Evidence-grounded postoperative navigation for gastrointestinal cancer patients"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.9,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
ocr = [
  "pymupdf>=1.26,<2",
  "rapidocr-onnxruntime>=1.4,<2",
]

[project.scripts]
gi-onco = "backend.app.cli:main"
gi-onco-benchmark = "backend.app.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
